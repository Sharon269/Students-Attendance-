<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <h1>
            <span id="facultyName"></span>
        </h1>
        <div class="top-boxes">
            <div class="box">
                <h2>Total Students</h2>
                <p id="totalStudents"></p>
            </div>
            <div class="box">
                <h2>Present</h2>
                <p id="presentCount"></p>
            </div>
            <div class="box">
                <h2>Absent</h2>
                <p id="absentCount"></p>
            </div>
        </div>
        <h2>Students</h2>
        <div id="studentContainer">
        </div>
        <div id="studentDetails">
        </div>
        <br>
        <a href="attendance.html">
            <button>
                Attendance Page
            </button>
        </a>
    </div>
    <script src="app.js"></script>
</body>
</html>
