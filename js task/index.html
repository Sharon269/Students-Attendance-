<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h1>Faculty Login</h1>
        <input
            type="text"
            id="username"
            placeholder="Enter Username">
        <input
            type="password"
            id="password"
            placeholder="Enter Password">
        <button onclick="login()">
            Login
        </button>
    </div>
    <script src="app.js"></script>
</body>
</html>
