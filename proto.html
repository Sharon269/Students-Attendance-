<!DOCTYPE html>
<html>
<head>

    

    <style>

        body {

            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
            

        }

        h1 {

            text-align: start;

        }

        #container {

            
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        

        }

        .card {

            width: 270px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 2px 10px gray;

        }

        button {

            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;

        }

        .loginBtn {

            background:aqua;

        }

        .certificateBtn {

            background: violet;

        }

        .lectureBtn {

            background: orange;

        }

        .assignmentBtn {

            background: purple;

        }

        .message {

            margin-top: 15px;
            font-weight: bold;

        }

    </style>

</head>

<body>

    <h1>Student Dashboard</h1>

    <div id="container"></div>

    <script>

        // CONSTRUCTOR FUNCTION

        function Person(name, course) {

            this.name = name;

            this.course = course;

        }


        // ONLY ONE PROTOTYPE FUNCTION

        Person.prototype.showDetails = function(action, index) {

            if(action === "login") {

                document.getElementById("message" + index).innerHTML =

                this.name + " Logged In Successfully";

            }

            else if(action === "certificate") {

                document.getElementById("message" + index).innerHTML =

                "Certificate Downloaded For " + this.name;

            }

            else if(action === "lecture") {

                document.getElementById("message" + index).innerHTML =

                this.name + " Started Watching Lecture";

            }

            else {

                document.getElementById("message" + index).innerHTML =

                this.name + " Submitted Assignment Successfully";

            }

        };


        // ARRAY OF OBJECTS

        let students = [

            new Person("Manoj", "JavaScript"),

            new Person("Ravi", "Python"),

            new Person("Suresh", "React JS")

        ];


        // DISPLAY STUDENT CARDS

        let cards = "";


        students.forEach(function(student, index) {

            cards += `

            <div class="card">

                <h2>${student.name}</h2>

                <p>Course : ${student.course}</p>

                <button
                class="loginBtn"
                onclick="students[${index}].showDetails('login', ${index})">

                Login

                </button>

                <button
                class="certificateBtn"
                onclick="students[${index}].showDetails('certificate', ${index})">

                Download Certificate

                </button>

                <button
                class="lectureBtn"
                onclick="students[${index}].showDetails('lecture', ${index})">

                Watch Lecture

                </button>

                <button
                class="assignmentBtn"
                onclick="students[${index}].showDetails('assignment', ${index})">

                Submit Assignment

                </button>

                <p
                class="message"
                id="message${index}">

                </p>

            </div>

            `;

        });


        // DISPLAY CARDS

        document.getElementById("container").innerHTML = cards;


        // __proto__ CHECK

        console.log(

            students[0].__proto__ === Person.prototype

        );

    </script>

</body>

</html>
